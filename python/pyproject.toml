[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "dsh-si"
version = "0.1.0"
description = "Numerical worker for the dsh-signal-integrity DeepSeek Harness plugin"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "scikit-rf>=1.9",
  "numpy>=2.0",
  "scipy>=1.14",
  "matplotlib>=3.9",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.9"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]

[tool.hatch.build.targets.wheel]
packages = ["dsh_si"]
